name: Test nodejs

# Type-checks every Node.js scenario and the tests, then runs the tests of the base module's
# helpers and of the webhook endpoint against a fake Signer on localhost. They need no Signer API
# key. Node.js 18 is the oldest the samples support (engines in package.json).
on:
  pull_request:
    paths:
      - "nodejs/**"
      - ".github/workflows/test-nodejs.yml"
  push:
    branches: [master]
    paths:
      - "nodejs/**"
      - ".github/workflows/test-nodejs.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "24"]
    defaults:
      run:
        working-directory: nodejs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # package-lock.json is not committed.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit -p scenarios
      - run: npx tsc --noEmit -p test
      - run: npm test
